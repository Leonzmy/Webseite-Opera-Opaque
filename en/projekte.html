<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Projects – Opera Opaque</title>
  <meta name="description" content="Overview of Opera Opaque's projects" />
  <link rel="stylesheet" href="../styles.css">
  <link rel="icon" href="../bilder/favicon.png" type="image/png">
</head>
<body class="projekte">

  <!-- Header -->
  <header class="site-header">
    <!--div class="brand">Opera Opaque</div-->
    <nav class="navlinks" aria-label="Main navigation">
      <div class="navlinks-links"><a href="projekte.html" aria-current="page">Projects</a>
      <a href="about.html">About</a>
      <a href="kontakt.html">Contact</a>
      <a href="../projekte.html" class="lang-switch" hreflang="de">DE</a>
      <a href="index.html" class="nav-logo-link"><img src="../bilder/o-drawing.png" alt="Home" class="nav-logo"></a></div>
    </nav>
  </header>

  <main class="projekte-wrap">
    <!-- Überschrift als Bild (bleibt gleich, deutsche Handschrift-Zeichnung) -->
    <h1 class="projekte-title">
      <img class="projekte-title-image" src="../bilder/projekte-drawing.jpg" alt="Projects">
    </h1>

    <!-- Grid: 5 Kacheln, 2 Spalten, 5. Kachel zentriert in eigener Reihe -->
    <section class="projekte-grid projekte-grid--2x2">
      <!-- Kachel 1: Propellerinsel -->
      <a class="tile tile--swap" href="projekte/propellerinsel.html" aria-label="Go to project page: Propellerinsel">
        <img class="img default" src="../bilder/propellerinsel-1.png" alt="Propellerinsel">
        <img class="img hover"   src="../bilder/propellerinsel-2.png" alt="" aria-hidden="true">
      </a>

      <!-- Kachel 2: Phantom -->
      <a class="tile tile--swap" href="projekte/phantom.html" aria-label="Go to project page: Phantom">
        <img class="img default" src="../bilder/phantom-1.png" alt="Phantom">
        <img class="img hover"   src="../bilder/phantom-2.png" alt="" aria-hidden="true">
      </a>

      <!-- Kachel 3: Seidenkoffer -->
      <a class="tile tile--swap" href="projekte/seidenkoffer.html" aria-label="Go to project page: Seidenkoffer">
        <img class="img default" src="../bilder/seidenkoffer-1.png" alt="Seidenkoffer">
        <img class="img hover"   src="../bilder/seidenkoffer-2.png" alt="" aria-hidden="true">
      </a>

      <!-- Kachel 4: Einladung zur Enthauptung -->
      <a class="tile tile--swap" href="projekte/enthauptung.html" aria-label="Go to project page: Invitation to a Beheading">
        <img class="img default" src="../bilder/enthauptung-1.png" alt="Invitation to a Beheading">
        <img class="img hover"   src="../bilder/enthauptung-2.png" alt="" aria-hidden="true">
      </a>

      <!-- Kachel 5: Orfeo (zentriert, eigene Reihe) -->
      <a class="tile tile--swap tile--centered" href="projekte/orfeo.html" aria-label="Go to project page: Orfeo">
        <img class="img default" src="../bilder/orfeo-1.png" alt="Orfeo">
        <img class="img hover"   src="../bilder/orfeo-2.png" alt="" aria-hidden="true">
      </a>
    </section>
  </main>
  <script src="../projekte.js"></script>

</html>
